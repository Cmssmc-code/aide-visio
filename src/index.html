<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('aidevisio.settings') || '{}');
    var t = s.theme;
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    if (s.fontScale) document.documentElement.style.setProperty('--font-scale', String(s.fontScale));
  } catch (e) {  }
})();
</script>
